<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>三國戰鬥足球</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #game { width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #rotate-hint { display: none; position: fixed; inset: 0; z-index: 10; background: #000; color: #fff; align-items: center; justify-content: center; text-align: center; font-size: 22px; font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; }
      #rotate-hint.show { display: flex; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint">請將手機橫放 📱↻</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
